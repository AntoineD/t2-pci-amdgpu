# /etc/modprobe.d/t2-wifi-off.conf
# Installed only by `install.sh --disable-wifi`, next to 99-t2-wifi-off.rules.
#
# Without Apple's firmware files brcmfmac cannot bring up the BCM4364 anyway:
# every boot it fails with "brcmf_pcie_setup: Dongle setup failed" and a
# WARNING in __flush_work from brcmf_pcie_remove.  It also probes in the window
# before the udev rule removes the port, and again after the warmfix's PCI
# rescan re-adds it, so the warning showed up twice per boot.  Blacklisting
# stops the modalias autoload; the device is removed regardless.
blacklist brcmfmac
