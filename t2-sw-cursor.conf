# t2-pci-amdgpu: software cursor in GNOME (mutter) on iMac20,x.
#
# The t2 kernels from 7.2.9 on drive the 5K panel as two 2560x2880 tiles
# (eDP-1 + DP-1), through the iMac20,x DMI quirk imac5k_table.  There the
# hardware cursor draws flickering lines around the pointer, in the tile that
# holds it.  With a software cursor they are gone (iMac20,2, 7.3.3-310.t2,
# mutter 50.6, 2026-11-13).  Read at login by systemd's environment.d
# generator, for every user and for the gdm greeter.
MUTTER_DEBUG_DISABLE_HW_CURSORS=1
