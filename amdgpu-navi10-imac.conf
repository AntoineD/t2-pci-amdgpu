# /etc/modprobe.d/amdgpu-navi10-imac.conf
#
# Installed only on iMac20,x with a Navi 10 GPU (Radeon Pro 5700 1002:731B /
# Apple 106B:021A, 5700 XT 1002:7319 / 106B:021B).
#
# Keeps memory-clock DPM out of the SMU's feature set at init.  amdgpu's
# default ppfeaturemask is 0xfff7bfff; this clears PP_MCLK_DPM_MASK (0x2), so
# the SMU is never asked to enable DPM_UCLK, MEM_VDDCI_SCALING and
# MEM_MVDD_SCALING.  On these Apple boards it hangs on that request: after a
# power-off the first probe failed with "SMU: No response msg_reg: 6"
# (EnableAllSmuFeatures) on 18 of 29 boots, and only the warmfix's
# remove/rescan recovered the GPU, ~6 s later and without HDMI/DP audio.
# With this mask: 9 of 9 power-off boots probed cleanly (iMac20,2,
# 2026-10-17), display manager at 8.89 s.
#
# Trade-off: the memory clock cannot scale up under load.  This repo pins DPM
# to "low" anyway (99-amdgpu-t2.rules).  Turning the three features back on at
# runtime through pp_features works, but the driver does not rebuild the
# memory-clock table (it stays at one 98 MHz level) and idle power rose from
# 11.4 W to 17 W, so it is not done.
#
# The same failure and workaround: omacom/omarchy PR #10169,
# t2linux/kernel#27; for the Radeon Pro 5300, t2linux/wiki#743.
options amdgpu ppfeaturemask=0xfff7bffd
