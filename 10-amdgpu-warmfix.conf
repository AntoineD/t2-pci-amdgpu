# /etc/dracut.conf.d/10-amdgpu-warmfix.conf
# Embed GPU and T2-related drivers in initramfs.
#
# force_drivers (not add_drivers) so the modules are loaded early rather than
# merely present.  The trade-off: a name that resolves to no .ko is fatal, not
# a warning.  "pcieport" used to be listed here and broke `dracut -f` outright:
#
#   dracut-install: Failed to find module 'pcieport'
#   dracut[E]: FAILED: .../dracut-install ... -m amdgpu nvme thunderbolt pcieport
#
# The PCIe port driver is compiled into the PCI core (CONFIG_PCIEPORTBUS=y).
# It is neither a .ko nor an entry in modules.builtin, so there is nothing to
# embed and nothing is lost by dropping it.
#
# Do not add apple_gmux.  amdgpu defers its probe until gmux binds, so with gmux
# here the probe moves into the initramfs (start ~4.2 s instead of ~7.0 s).
# Tried on iMac20,2, 7 boots: the cold probe failed on 6 (about half before);
# the initramfs held switch-root until the failing probe ended (5.6 -> 7.6 s),
# so the display manager came no earlier; the re-probe took 4.3 s, not 3.6 s;
# Plymouth lost its splash; and one boot failed the re-probe as well, then the
# retry ("invalid ip discovery binary signature") left the screen black.
#
# Every name below must resolve, e.g.  modinfo -n amdgpu
force_drivers+=" amdgpu nvme thunderbolt "
