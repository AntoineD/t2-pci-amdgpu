# /etc/modprobe.d/t2-applesmc.conf — installed by t2-pci-amdgpu
#
# applesmc no longer autoloads from its DMI modalias (dmi*:pn*iMac*:rvn*Apple*:).
# applesmc-late.service loads it instead, and only on kernels that need it.
#
# The t2 kernels from 7.3 on bind the SMC (ACPI APP0001) with macsmc_acpi
# (linux-t2-patches 3001-3014), which also brings the fan, temperature and
# power sensors (macsmc_hwmon).  applesmc then cannot work: on iMac20,2 with
# 7.3.3-310.t2 its probe failed with -EIO after 54 s and its init with
# "driver init failed (ret=-5)" after 107 s, polling the same SMC ports
# macsmc drives the whole time.  Whatever loaded it hung for that long: a udev
# worker at coldplug, or applesmc-late, which held t2fanrd back behind it.
#
# A blacklist stops only alias loading.  The explicit modprobe in
# applesmc-late.service still loads applesmc on the kernels without macsmc
# (7.2 and older), where the fan daemon needs it.
blacklist applesmc
