# /etc/modprobe.d/amdgpu.conf — AMD GPU module options for Apple T2 iMac
#
# Disable ASPM at the module level.  This duplicates the kernel cmdline param
# (amdgpu.aspm=0) so the setting survives rescue boots and initramfs rebuilds
# that bypass GRUB.
options amdgpu aspm=0

# Prevent the legacy radeon driver from racing amdgpu at module-load time.
blacklist radeon
