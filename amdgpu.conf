# /etc/modprobe.d/amdgpu.conf — AMD GPU module options for Apple T2 iMac
#
# Disable ASPM and runtime power management at the module level.  This
# duplicates the kernel cmdline params (amdgpu.aspm=0 amdgpu.runpm=0) so the
# settings survive rescue boots and initramfs rebuilds that bypass GRUB.
# runpm=0 prevents the driver from powering down the dGPU at runtime, which
# is a known cause of GPU disappearance on Apple T2 hardware.
options amdgpu aspm=0 runpm=0

# Prevent the legacy radeon driver from racing amdgpu at module-load time.
blacklist radeon
