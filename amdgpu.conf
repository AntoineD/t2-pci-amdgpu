# /etc/modprobe.d/amdgpu.conf — AMD GPU module options for Apple T2 iMac
#
# Covers both PCI functions of the GPU: the VGA function (amdgpu) and the
# HDMI audio function (snd_hda_intel).
#
# Disable ASPM and runtime power management at the module level.  This
# duplicates the kernel cmdline params (amdgpu.aspm=0 amdgpu.runpm=0) so the
# settings survive rescue boots and initramfs rebuilds that bypass GRUB.
# runpm=0 prevents the driver from powering down the dGPU at runtime, which
# is a known cause of GPU disappearance on Apple T2 hardware.
options amdgpu aspm=0 runpm=0

# Prevent the legacy radeon driver from racing amdgpu at module-load time.
blacklist radeon

# Keep the GPU's HDMI audio function (03:00.1) out of runtime suspend.
#
# 99-amdgpu-t2.rules writes power/control=on for this function, but the write
# does not survive: snd_hda_intel calls pm_runtime_allow() from its (async)
# probe work, which resets the attribute to "auto" after udev has run.  No
# udev rule can reliably win that race.  power_save_controller=0 makes
# azx_runtime_idle() return -EBUSY instead, so the controller never
# auto-suspends — power/control still reads "auto", but nothing acts on it.
#
# Side effect: also applies to the onboard Intel HDA controller (00:1f.3),
# which then stops runtime-suspending.  Idle power cost only.
options snd_hda_intel power_save_controller=0
