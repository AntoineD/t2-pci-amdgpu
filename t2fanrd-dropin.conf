# /etc/systemd/system/t2fanrd.service.d/10-t2-pci-amdgpu.conf
#
# Additions to the t2linux package's own t2fanrd.service
# (/usr/lib/systemd/system), installed when the package is.  The package unit
# is kept for its sandboxing; this adds what it lacks.  Without the package,
# install.sh installs this repo's full t2fanrd.service and bundled binary
# instead.
[Unit]
After=applesmc-late.service

[Service]
# Not on kernels with macsmc_acpi (t2 kernels from 7.3 on): there the SMC's own
# curve drives the fan (measurements: CLAUDE.md, "Fan on macsmc kernels").
# "+" runs the check outside the package's sandbox: ProtectKernelModules=
# hides /usr/lib/modules, and modinfo would find nothing.  To run the daemon
# anyway, add a later drop-in with empty "ExecCondition=" and "ExecStartPre=":
# the wait below is for applesmc's fan1_manual, which macsmc does not have.
ExecCondition=+/bin/sh -c '! modinfo -n macsmc_acpi >/dev/null 2>&1'
# The package says ExecStart=t2fanrd, and systemd resolves a bare name through
# /usr/local/bin first, where older installs of this repo put a stale binary.
ExecStart=
ExecStart=/usr/bin/t2fanrd
# Wait for the attribute the daemon opens.  The package unit has no wait and
# the default RestartSec (100 ms): a start before applesmc is up would use the
# whole start limit (5 starts in 10 s) in half a second, and the unit would
# stay failed with the fan left to the SMC.
ExecStartPre=/usr/local/bin/t2-wait-sysfs.sh -t 15 \
  '/sys/bus/acpi/devices/APP0001:*/fan1_manual' \
  '/sys/devices/platform/applesmc.*/fan1_manual'
RestartSec=5
# Hand the fan back to the SMC when the daemon stops, so a dead daemon never
# leaves it pinned at a stale manual RPM.  "+" runs this outside the package's
# sandbox.
ExecStopPost=+/usr/bin/bash -c 'shopt -s nullglob; for f in /sys/bus/acpi/devices/APP0001:*/fan?_manual /sys/devices/platform/applesmc.*/fan?_manual; do echo 0 >"$f" || true; done; exit 0'
