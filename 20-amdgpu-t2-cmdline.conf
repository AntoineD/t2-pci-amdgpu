# /etc/dracut.conf.d/20-amdgpu-t2-cmdline.conf
#
# Embeds kernel parameters into the initramfs as a fallback.
# These are applied ONLY when the bootloader passes no cmdline (e.g. rescue
# boots, direct EFI stub launch).  They do NOT override GRUB parameters.
kernel_cmdline="pci=noaer pcie_aspm=off amdgpu.aspm=0 amdgpu.runpm=0"
